name: Update Profile Art & Heatmap

# Refreshes the contribution graph SVG, data, and snake animations daily from real data.
# Runs daily, plus on pushes to main, plus on manual dispatch.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scrape live contributions & build JSON
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render contribution snake calendar SVG
        run: python scripts/render_snake_contribution_svg.py

      - name: Commit and push updated art
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution heatmap to commit."
          else
            git commit -m "chore: refresh profile art & contributions [skip ci]"
            git push
          fi
