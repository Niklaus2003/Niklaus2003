<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="matrix-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <linearGradient id="card-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- CRT scanline overlay -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1.2" opacity="0.25"/>
    </pattern>

    <!-- Grid pattern for the snake arena -->
    <pattern id="arcade-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-fruit {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.22); opacity: 1; }
      }
      @keyframes snake-crawl {
        0% { stroke-dashoffset: 480; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes crt-flicker {
        0%, 100% { opacity: 0.97; }
        50% { opacity: 1; }
      }
      @keyframes score-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.3; }
      }
      .fruit-pulse { transform-origin: center; animation: pulse-fruit 1.8s ease-in-out infinite; }
      .snake-body { stroke-dasharray: 60 420; animation: snake-crawl 6s linear infinite; }
      .cursor-blink { animation: score-blink 1s steps(2, start) infinite; }
      .card-hover { transition: transform 0.2s ease; }
    </style>
  </defs>

  <!-- Main Window Frame -->
  <rect width="860" height="430" rx="12" fill="url(#matrix-bg)"/>
  <rect x="0.5" y="0.5" width="859" height="429" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="0" y1="32" x2="860" y2="32" stroke="#334155" stroke-opacity="0.3"/>

  <!-- Title bar dots -->
  <circle cx="20" cy="16.0" r="5" fill="#ef4444"/>
  <circle cx="36" cy="16.0" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="16.0" r="5" fill="#10b981"/>

  <!-- Title text -->
  <text x="430.0" y="20.0" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">
    aaron@github: ~/arcade/snake-project-matrix.sh --play
  </text>

  <!-- Arcade HUD Scorebar -->
  <g transform="translate(20, 44)">
    <rect width="820" height="32" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <text x="14" y="21" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="1">
      🎮 SNAKE_MATRIX::v2.4
    </text>

    <text x="210" y="21" fill="#64748b" font-size="11">
      SCORE: <tspan fill="#facc15" font-weight="700">9,840</tspan>
    </text>

    <text x="340" y="21" fill="#64748b" font-size="11">
      TARGETS: <tspan fill="#4ade80" font-weight="700">4 / 4 CONSUMED</tspan>
    </text>

    <text x="540" y="21" fill="#64748b" font-size="11">
      ENERGY: <tspan fill="#38bdf8">99.8%</tspan>
    </text>

    <text x="806" y="21" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="end">
      LIVES: ♥ ♥ ♥
    </text>
  </g>

  <!-- LEFT: Snake Game Arena (340px wide) -->
  <g transform="translate(20, 86)">
    <!-- Arena Background & Grid -->
    <rect width="330" height="305" rx="8" fill="#040810" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="330" height="305" rx="8" fill="url(#arcade-grid)"/>

    <!-- CRT Corner Brackets -->
    <path d="M 10 24 L 10 10 L 24 10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 320 24 L 320 10 L 306 10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 10 281 L 10 295 L 24 295" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 320 281 L 320 295 L 306 295" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

    <!-- Arena Header Label -->
    <text x="165" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">
      ARENA // 53x7 RUNTIME
    </text>

    <!-- Animated Snake Track Path -->
    <path id="snake-run"
          d="M 36 60 L 294 60 L 294 120 L 36 120 L 36 185 L 294 185 L 294 250 L 72 250"
          fill="none" stroke="#166534" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

    <!-- Animated Glowing Snake Body -->
    <path class="snake-body"
          d="M 36 60 L 294 60 L 294 120 L 36 120 L 36 185 L 294 185 L 294 250 L 72 250"
          fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow-green)"/>

    <!-- Target 1 Food (Vision) at (165, 60) -->
    <g class="fruit-pulse" transform="translate(165, 60)">
      <circle r="7" fill="#f43f5e" filter="url(#glow-amber)"/>
      <circle r="2.5" fill="#fff"/>
      <text x="14" y="4" fill="#f43f5e" font-size="9" font-weight="700">T1:CV</text>
    </g>

    <!-- Target 2 Food (Voice) at (294, 150) -->
    <g class="fruit-pulse" transform="translate(294, 150)" style="animation-delay: -0.4s;">
      <circle r="7" fill="#facc15" filter="url(#glow-amber)"/>
      <circle r="2.5" fill="#fff"/>
      <text x="-48" y="4" fill="#facc15" font-size="9" font-weight="700">T2:VOICE</text>
    </g>

    <!-- Target 3 Food (AI/ML) at (130, 185)" -->
    <g class="fruit-pulse" transform="translate(130, 185)" style="animation-delay: -0.8s;">
      <circle r="7" fill="#c084fc" filter="url(#glow-amber)"/>
      <circle r="2.5" fill="#fff"/>
      <text x="14" y="4" fill="#c084fc" font-size="9" font-weight="700">T3:AGENTS</text>
    </g>

    <!-- Target 4 Food (FullStack) at (190, 250) -->
    <g class="fruit-pulse" transform="translate(190, 250)" style="animation-delay: -1.2s;">
      <circle r="7" fill="#38bdf8" filter="url(#glow-amber)"/>
      <circle r="2.5" fill="#fff"/>
      <text x="14" y="4" fill="#38bdf8" font-size="9" font-weight="700">T4:STACK</text>
    </g>

    <!-- Arena Footer Legend -->
    <text x="165" y="284" fill="#22c55e" font-size="10" text-anchor="middle" font-weight="600">
      ● RETRO-SNAKE NAVIGATING LIVE PROJECTS
    </text>
  </g>

  <!-- RIGHT: Project Matrix Cards (450px wide) -->
  <g transform="translate(370, 86)">

    <!-- Card 1: Computer Vision & Pose -->
    <g transform="translate(0, 0)">
      <rect width="470" height="68" rx="8" fill="url(#card-glow)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="22" cy="24" r="8" fill="#ef4444" fill-opacity="0.2"/>
      <text x="22" y="28" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">1</text>
      
      <text x="40" y="24" fill="#e2e8f0" font-size="13" font-weight="700">
        Computer Vision &amp; Pose Estimation
      </text>
      <text x="455" y="24" fill="#ef4444" font-size="10" font-weight="700" text-anchor="end">
        [CLEARED / 98%]
      </text>

      <text x="40" y="42" fill="#64748b" font-size="11">
        Real-time tracking, edge detection, pose analysis &amp; gesture mapping.
      </text>
      <text x="40" y="58" fill="#facc15" font-size="10.5">
        Stack: <tspan fill="#e2e8f0">Python · OpenCV · MediaPipe · NumPy · Deep Learning</tspan>
      </text>
    </g>

    <!-- Card 2: Voice Tech & Autonomous Agents -->
    <g transform="translate(0, 78)">
      <rect width="470" height="68" rx="8" fill="url(#card-glow)" stroke="#facc15" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="22" cy="24" r="8" fill="#facc15" fill-opacity="0.2"/>
      <text x="22" y="28" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">2</text>
      
      <text x="40" y="24" fill="#e2e8f0" font-size="13" font-weight="700">
        Voice AI Assistants &amp; Agent Systems
      </text>
      <text x="455" y="24" fill="#facc15" font-size="10" font-weight="700" text-anchor="end">
        [ACTIVE / ONLINE]
      </text>

      <text x="40" y="42" fill="#64748b" font-size="11">
        Speech recognition, conversational bots, tool-calling agents &amp; LLMs.
      </text>
      <text x="40" y="58" fill="#facc15" font-size="10.5">
        Stack: <tspan fill="#e2e8f0">Voice AI · STT / TTS · LangChain · OpenAI · FastAPI</tspan>
      </text>
    </g>

    <!-- Card 3: AI & Machine Learning Experiments -->
    <g transform="translate(0, 156)">
      <rect width="470" height="68" rx="8" fill="url(#card-glow)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="22" cy="24" r="8" fill="#c084fc" fill-opacity="0.2"/>
      <text x="22" y="28" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">3</text>
      
      <text x="40" y="24" fill="#e2e8f0" font-size="13" font-weight="700">
        Applied AI &amp; Neural Architecture
      </text>
      <text x="455" y="24" fill="#c084fc" font-size="10" font-weight="700" text-anchor="end">
        [OPTIMIZED]
      </text>

      <text x="40" y="42" fill="#64748b" font-size="11">
        Model training, inference benchmarking, multimodal embeddings.
      </text>
      <text x="40" y="58" fill="#facc15" font-size="10.5">
        Stack: <tspan fill="#e2e8f0">PyTorch · Transformers · Scikit-Learn · Vector DBs</tspan>
      </text>
    </g>

    <!-- Card 4: Full-Stack Web Experiments -->
    <g transform="translate(0, 234)">
      <rect width="470" height="68" rx="8" fill="url(#card-glow)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="22" cy="24" r="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="22" y="28" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">4</text>
      
      <text x="40" y="24" fill="#e2e8f0" font-size="13" font-weight="700">
        Full-Stack &amp; Embedded I/O Platforms
      </text>
      <text x="455" y="24" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="end">
        [EXPANDING]
      </text>

      <text x="40" y="42" fill="#64748b" font-size="11">
        Interactive web applications connecting ML inference to sleek UIs.
      </text>
      <text x="40" y="58" fill="#facc15" font-size="10.5">
        Stack: <tspan fill="#e2e8f0">React · Node.js · Express · REST APIs · Tailwind · IoT</tspan>
      </text>
    </g>

  </g>

  <!-- Console Footer Prompt -->
  <g transform="translate(20, 408)">
    <text x="0" y="10" fill="#64748b" font-size="11">
      <tspan fill="#22c55e">aaron@github</tspan>:<tspan fill="#38bdf8">~/projects</tspan>$ ./slither.sh --status=ready
    </text>
    <rect x="360" y="0" width="7" height="12" fill="#22c55e" class="cursor-blink"/>
    <text x="820" y="10" fill="#64748b" font-size="10.5" text-anchor="end">
      ENGINE: ELECTRONICS + AI + SOFTWARE · JACK OF ALL TRADES
    </text>
  </g>

</svg>